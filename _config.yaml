# site properties and page defaults
title: Holechek Laboratory
subtitle: 
description: Our training philosophy draws on the SOLUR and iSTEM SOLUR Prep models developed at Arizona State University under Dr. Susan Holechek, whose work expanding
undergraduate research access for online and first-generation students has been recognized with ASU's Catalyst Award for inclusion and the Outstanding
Faculty Mentor Award. We apply that same commitment to every researcher who joins this lab.
header: images/background.jpg
footer: images/background.jpg
proofer: false

